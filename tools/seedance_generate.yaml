    zh_Hans: 视频分辨率。Seedance 2.5 支持 480p、720p、1080p；Seedance 2.0 Standard 支持至 4k，Fast/Mini
      支持 480p、720p。其他模型能力见服务文档。
  llm_description: Optional output resolution (480p/720p/1080p).
  default: 480p
  options:
  - value: 480p
    label:
      en_US: 480p
      zh_Hans: 480p
  - value: 720p
