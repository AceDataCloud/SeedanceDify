  max: 259200
- name: omni_reference_task_type
  type: select
  required: false
  form: form
  label:
    en_US: Omni Reference Task Type
    zh_Hans: 参考任务类型
  human_description:
    en_US: Set omni reference task type for this operation.
    zh_Hans: Seedance 2.5 全模态任务类型：auto 自动判断；reference 参考素材生成；edit 编辑参考视频；extend 延长参考视频。reference
      需要至少一个 reference_image/reference_video/reference_audio；edit/extend 需要 reference_video
      和 adaptive 比例；edit 的 duration 必须为 -1。
  llm_description: Set omni reference task type for this operation.
  options:
  - value: auto
    label:
      en_US: auto
      zh_Hans: auto
  - value: reference
    label:
      en_US: reference
      zh_Hans: reference
  - value: edit
    label:
      en_US: edit
      zh_Hans: edit
  - value: extend
    label:
      en_US: extend
      zh_Hans: extend
- name: output_format
