- name: duration
  type: number
  required: false
  form: form
  label:
    en_US: Duration (seconds)
    zh_Hans: 时长（秒）
  human_description:
    en_US: Duration in seconds
    zh_Hans: 生成视频的时长，单位为秒。Seedance 1.0 系列支持 2–12 秒且不支持 -1；Seedance 1.5 Pro 支持 4–12
      秒或 -1；Seedance 2.0 系列支持 4–15 秒或 -1；Seedance 2.5 支持 4–30 秒或 -1。-1 表示自动时长；2.5
      视频编辑仅支持 -1。
  llm_description: Duration in seconds
  min: -1
  max: 30
- name: frames
  type: number
  required: false
  form: form
  label:
    en_US: Frames
    zh_Hans: 帧数
  human_description:
    en_US: Set frames for this operation.
    zh_Hans: 生成视频的帧数，取值范围 [29, 289] 且必须满足 25+4n（如 29、33、37……289）。仅 Seedance 1.0 系列支持，Seedance
      1.5 Pro 与 2.0 系列请改用 duration。duration 和 frames 二选一即可；若同时指定，frames 的优先级高于 duration。
  llm_description: Set frames for this operation.
  min: 29
  max: 289
- name: seed
  type: number
  required: false
  form: form
  label:
    en_US: Seed
    zh_Hans: 随机种子
  human_description:
    en_US: Set seed for this operation.
    zh_Hans: 用于可复现生成的随机种子，取值范围为 -1 至 4294967295；-1 表示随机。
  llm_description: Set seed for this operation.
  min: -1
  max: 4294967295
- name: camerafixed
  type: boolean
  required: false
  form: form
  label:
    en_US: Camerafixed
    zh_Hans: 固定镜头
  human_description:
    en_US: Set camerafixed for this operation.
    zh_Hans: 是否在生成过程中固定摄像机位置
  llm_description: Set camerafixed for this operation.
- name: watermark
  type: boolean
  required: false
  form: form
  label:
    en_US: Watermark
    zh_Hans: 水印
  human_description:
    en_US: Set watermark for this operation.
    zh_Hans: 是否在生成的视频上添加水印
  llm_description: Set watermark for this operation.
- name: generate_audio
  type: boolean
  required: false
  form: form
  label:
    en_US: Generate Audio
    zh_Hans: 生成音频
  human_description:
    en_US: Include generated audio in the video.
    zh_Hans: 是否生成同步音频。Seedance 2.5、Seedance 2.0 系列和 Seedance 1.5 Pro 支持此参数。
  llm_description: Include generated audio in the video.
  default: false
- name: callback_url
  type: string
  required: false
  form: form
  label:
    en_US: Callback Url
    zh_Hans: 回调 URL
  human_description:
    en_US: Set callback url for this operation.
    zh_Hans: 接收任务最终结果通知的回调 URL。提供后，API 将立即返回 `task_id`，并在任务完成时向该 URL 推送结果。
  llm_description: Set callback url for this operation.
- name: return_last_frame
  type: boolean
  required: false
  form: form
  label:
    en_US: Return Last Frame
    zh_Hans: 返回末帧
  human_description:
    en_US: Set return last frame for this operation.
    zh_Hans: 是否返回生成视频的最后一帧
  llm_description: Set return last frame for this operation.
- name: execution_expires_after
  type: number
  required: false
  form: form
  label:
    en_US: Execution Expires After
    zh_Hans: 任务有效时间
  human_description:
    en_US: Set execution expires after for this operation.
    zh_Hans: 任务超时阈值，单位为秒
  llm_description: Set execution expires after for this operation.
