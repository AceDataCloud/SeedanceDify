identity:
  name: seedance_generate_video
  author: acedatacloud
  label:
    en_US: Seedance Generate Video
    zh_Hans: Seedance 生成视频
description:
  human:
    en_US: Generate a video with Ace Data Cloud Seedance Videos API.
    zh_Hans: 通过 Ace Data Cloud Seedance Videos API 生成视频。
  llm: Generate a video with Ace Data Cloud Seedance Videos API. For asynchronous
    results, preserve task_id and use the task retrieval tool until completion. A
    successful submission is not completed output.
parameters:
- name: model
  type: select
  required: false
  form: form
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Select a model currently supported by this API. Availability and pricing
      depend on the chosen model.
    zh_Hans: 用于视频生成的模型 ID。Seedance 2.5 使用 `doubao-seedance-2-5-260628`。
  llm_description: Select a model currently supported by this API. Availability and
    pricing depend on the chosen model.
  default: doubao-seedance-2-0-mini-260615
  options:
  - value: doubao-seedance-1-0-pro-250528
    label:
      en_US: doubao-seedance-1-0-pro-250528
      zh_Hans: doubao-seedance-1-0-pro-250528
  - value: doubao-seedance-1-0-pro-fast-251015
    label:
      en_US: doubao-seedance-1-0-pro-fast-251015
      zh_Hans: doubao-seedance-1-0-pro-fast-251015
  - value: doubao-seedance-1-5-pro-251215
    label:
      en_US: doubao-seedance-1-5-pro-251215
      zh_Hans: doubao-seedance-1-5-pro-251215
  - value: doubao-seedance-1-0-lite-t2v-250428
    label:
      en_US: doubao-seedance-1-0-lite-t2v-250428
      zh_Hans: doubao-seedance-1-0-lite-t2v-250428
  - value: doubao-seedance-1-0-lite-i2v-250428
    label:
      en_US: doubao-seedance-1-0-lite-i2v-250428
      zh_Hans: doubao-seedance-1-0-lite-i2v-250428
  - value: doubao-seedance-2-0-260128
    label:
      en_US: doubao-seedance-2-0-260128
      zh_Hans: doubao-seedance-2-0-260128
  - value: doubao-seedance-2-0-fast-260128
    label:
      en_US: doubao-seedance-2-0-fast-260128
      zh_Hans: doubao-seedance-2-0-fast-260128
  - value: doubao-seedance-2-0-mini-260615
